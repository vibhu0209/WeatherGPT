# Initial provider fusion weights. They deliberately remain equal until a
# representative matched-observation archive justifies calibrated changes.
defaults:
  open-meteo: 1.0
  ecmwf-ifs: 1.0
  openweather: 1.0
  weatherapi: 1.0
  imd: 1.0
variables:
  temperature:
    open-meteo: 1.0
    ecmwf-ifs: 1.0
    imd: 1.0
  rain_chance:
    open-meteo: 1.0
    ecmwf-ifs: 1.0
    imd: 1.0
  wind_ms:
    open-meteo: 1.0
    ecmwf-ifs: 1.0
    imd: 1.0
