# Default emulator backend. Override without editing Kotlin:
#   weathergpt.apiUrl=http://192.168.1.10:8000/
# or: gradlew installDebug -Pweathergpt.apiUrl=http://192.168.1.10:8000/
# Trailing slash is required.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
org.gradle.workers.max=2
